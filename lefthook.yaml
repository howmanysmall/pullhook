commit-msg:
  jobs:
    - name: commitlint
      run: aube run commitlint -- --edit {1}
      skip:
        - merge
        - rebase

min_version: 2.1.6

post-merge:
  jobs:
    - name: package-install
      run: aube install

pre-commit:
  jobs:
    - group:
        parallel: true
        jobs:
          - name: biome-fix
            glob:
              - "**/*.json"
              - "**/*.jsonc"
            run: biome check --write --no-errors-on-unmatched {staged_files}
            stage_fixed: true

          - name: oxfmt
            glob:
              - "**/*.js"
              - "**/*.jsx"
              - "**/*.ts"
              - "**/*.tsx"
              - "**/*.mjs"
              - "**/*.mts"
              - "**/*.cjs"
              - "**/*.cts"
              - "**/*.css"
              - "**/*.html"
              - "**/*.graphql"
              - "**/*.gql"
              - "**/*.yaml"
              - "**/*.yml"
            run: oxfmt {staged_files}
            stage_fixed: true

          - name: rumdl-fix
            glob: "**/*.md"
            run: |
              rumdl fmt {staged_files}
              rumdl check {staged_files}
            stage_fixed: true

          - name: tombi-fix
            glob: "**/*.toml"
            run: |
              tombi format {staged_files}
              tombi lint {staged_files}
            stage_fixed: true

          - name: rustfmt
            glob: "**/*.rs"
            run: cargo fmt -- {staged_files}
            stage_fixed: true

    - group:
        jobs:
          - name: oxfmt-json
            glob:
              - "**/*.json"
              - "**/*.jsonc"
            run: oxfmt {staged_files}
            stage_fixed: true

    - group:
        parallel: true
        jobs:
          - name: audit
            run: cargo audit --quiet

          - name: clippy
            run: cargo clippy --all-targets -- -D warnings

          - name: deny
            run: cargo deny check

          - name: shear
            run: cargo shear

          - name: gitleaks
            run: gitleaks protect --staged

pre-push:
  jobs:
    - name: test
      run: cargo nextest run --no-tests=pass
