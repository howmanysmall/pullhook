commit-msg:
  jobs:
    - name: commitlint
      run: aube run commitlint -- --edit {1}
      skip:
        - merge
        - rebase

min_version: 2.1.4

post-merge:
  jobs:
    - name: package-install
      run: aube install

pre-commit:
  jobs:
    - glob:
        - "**/*.json"
        - "**/*.jsonc"
      name: biome-fix
      priority: 1
      run: biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - glob:
        - "**/*.css"
        - "**/*.html"
        - "**/*.graphql"
        - "**/*.gql"
      name: oxfmt-web
      priority: 1
      run: oxfmt {staged_files}
      stage_fixed: true

    - glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.mjs"
        - "**/*.mts"
        - "**/*.cjs"
        - "**/*.cts"
      name: oxfmt-js-ts
      priority: 1
      run: oxfmt {staged_files}
      stage_fixed: true

    - glob:
        - "**/*.yaml"
        - "**/*.yml"
      name: oxfmt-yaml
      priority: 1
      run: oxfmt {staged_files}
      stage_fixed: true

    - glob: "**/*.md"
      name: rumdl-fix
      priority: 1
      run: |
        rumdl fmt {staged_files}
        rumdl check {staged_files}
      stage_fixed: true

    - glob: "**/*.toml"
      name: tombi-fix
      priority: 1
      run: |
        tombi format {staged_files}
        tombi lint {staged_files}
      stage_fixed: true

    - glob: "**/*.rs"
      name: rustfmt
      priority: 1
      run: cargo fmt -- {staged_files}
      stage_fixed: true

    - glob:
        - "**/*.json"
        - "**/*.jsonc"
      name: oxfmt-json
      priority: 2
      run: oxfmt {staged_files}
      stage_fixed: true

    - name: audit
      priority: 3
      run: cargo audit --quiet

    - name: clippy
      priority: 3
      run: cargo clippy --all-targets -- -D warnings

    - name: deny
      priority: 3
      run: cargo deny check

    - name: shear
      priority: 3
      run: cargo shear

    - name: gitleaks
      priority: 3
      run: gitleaks protect --staged
  parallel: true

pre-push:
  jobs:
    - name: test
      run: cargo nextest run --no-tests=pass
